name: Запрос на изменение
description: Изменение объёма, срока, бюджета или критериев
title: "[CR] "
body:
  - type: textarea
    id: request
    attributes:
      label: Причина и предлагаемое изменение
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Влияние на поставки, срок, стоимость, риски и приёмку
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Решение, согласующие и дата
      value: "Предложено; решение ещё не принято."
